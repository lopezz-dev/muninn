<!-- Plantilla de correo para «Magic link» y «Confirm sign up» (Authentication › Emails › Templates).
     Asunto: Tu código de Muninn: {{ .Token }}
     Solo el código: el enlace no sirve en la PWA de iPhone ni en el escritorio (ver ADR-0022). -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 420px; margin: 0 auto; padding: 32px 24px; color: #0C0D10">
  <p style="margin: 0 0 8px; font-size: 15px; font-weight: 600">Muninn</p>
  <h1 style="margin: 0 0 16px; font-size: 22px; font-weight: 600">Tu código para entrar</h1>
  <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #4A4F57">Escríbelo en la pantalla de inicio de sesión. Caduca en una hora.</p>
  <p style="margin: 0 0 24px; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 32px; font-weight: 600; letter-spacing: 0.3em">{{ .Token }}</p>
  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6B717A">Si no has pedido este código, ignora este correo: nadie puede entrar sin él.</p>
</div>
