name: Release

# Flujo: develop → PR a main → release-please abre/actualiza un "Release PR" con versión y CHANGELOG
# a partir de los conventional commits → al mergearlo se crea el tag + GitHub Release
# y se compilan los instaladores de Windows, Linux y macOS, firmados para el actualizador junto a `latest.json`
# (ADR-0047). Las apps instaladas leen ese `latest.json` de la última release al abrirse.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # El commit de versión de release-please vive en main: lo devolvemos a develop.
  back-merge:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge --no-ff origin/main -m "chore: back-merge ${{ needs.release-please.outputs.tag_name }} into develop"
          git push origin develop

  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          # macOS solo se compila al publicar (en un repo privado sus minutos cuentan ×10).
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Firma y notarización de Apple (si hay secretos)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::Sin secretos de Apple: el .dmg se publicará sin firmar ni notarizar."
          fi

      # Sin clave no hay actualización posible (ADR-0047): mejor parar que publicar instaladores que nadie verifica.
      - name: Comprobar la clave de firma del actualizador
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY (pasos en docs/fase-final.md)."
            exit 1
          fi
          if grep -q 'PENDIENTE_CLAVE_PUBLICA' apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey de tauri.conf.json sigue sin la clave pública."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Solo aquí: en local `tauri build` exigiría la clave privada para firmar.
      - name: Generar los artefactos del actualizador
        shell: bash
        run: |
          node -e "const f='apps/desktop/src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2))"

      # Sube los instaladores firmados y `latest.json` a la release que acaba de crear release-please.
      # Las tres plataformas escriben en el mismo `latest.json`: `retryAttempts` cubre la carrera al fusionarlo.
      # Fijada a un commit: recibe la clave de firma, y una etiqueta (`v0`) podría moverse a otro código.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: Muninn ${{ needs.release-please.outputs.tag_name }}
          retryAttempts: 3
          args: ${{ matrix.args }}
