<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Muninn · Your personal operating system</title>
    <meta
      name="description"
      content="Muninn is your personal operating system: projects with a Kanban board, tasks, notes, finances, GitHub, news and an assistant, on your computer and your phone."
    />
    <meta name="theme-color" content="#0C0D10" />
    <meta name="color-scheme" content="dark" />

    <!-- Iconos generados desde el logo con `pnpm --filter @muninn/web icons` (scripts/icons.mjs). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Muninn" />

    <!--
      Tarjeta al compartir un enlace. Los que la leen no ejecutan JavaScript: URLs absolutas y del dominio de
      producción, que sustituye el build (SITE_URL de vite/seo.ts). Sin <link rel="canonical"> fijo: la pone cada
      página pública desde lib/seo.ts, y las guías prerenderizadas la llevan ya en su HTML.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muninn" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Muninn · Your personal operating system" />
    <meta
      property="og:description"
      content="Projects with a Kanban board, tasks, notes, finances, GitHub, news and an assistant, on your computer and your phone."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Muninn logo and the tagline “Tu sistema operativo personal”" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muninn · Your personal operating system" />
    <meta
      name="twitter:description"
      content="Projects with a Kanban board, tasks, notes, finances, GitHub, news and an assistant, on your computer and your phone."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Muninn logo and the tagline “Tu sistema operativo personal”" />
    <!-- Qué es Muninn, para los buscadores (schema.org). Las guías prerenderizadas añaden el suyo. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Muninn",
            "url": "%SITE_URL%/",
            "inLanguage": ["en", "es"]
          },
          {
            "@type": "SoftwareApplication",
            "name": "Muninn",
            "url": "%SITE_URL%/",
            "description": "Personal operating system: projects with a Kanban board, tasks, notes, finances, GitHub, news and an assistant, on your computer and your phone.",
            "applicationCategory": "ProductivityApplication",
            "operatingSystem": "Web, Windows, macOS, Linux, iOS, Android",
            "inLanguage": ["en", "es"],
            "image": "%SITE_URL%/og-image.jpg"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Muninn is your personal operating system: projects, tasks, notes, finances and more in one place.
        To use it, turn on JavaScript in your browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
